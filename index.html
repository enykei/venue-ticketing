<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue Ticketing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Grand Theatre</h1>

  <div class="controls">
    <button data-nav="zoom-in">+</button>
    <button data-nav="zoom-out">−</button>
    <button data-nav="up">↑</button>
    <button data-nav="down">↓</button>
    <button data-nav="left">←</button>
    <button data-nav="right">→</button>
    <button data-nav="reset">Reset</button>
  </div>

  <div class="stage">STAGE</div>

  <main class="venue" id="venue">
    
  </main>

  <aside class="panel" id="panel">
    <h2>Seat details</h2>
    <p id="panel-info">Click a seat to inspect it.</p>
    <button id="add-btn" disabled>Add to cart</button>
  </aside>

  <aside class="cart" id="cart">
    <h2>Cart</h2>
    <ul id="cart-list"></ul>
    <p class="total">Total: $<span id="cart-total">0</span></p>
  </aside>

  <script src="script.js"></script>
</body>
</html>
